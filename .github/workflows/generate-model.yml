name: Generate Model

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/generate-model.yml
      - Dockerfile.cli
      - requirements-cli.txt
      - src/**
      - viewer/**
      - example_request.json
  workflow_dispatch:
    inputs:
      definition_path:
        description: Path to the JSON building definition in this repository
        required: true
        default: example_request.json
      artifact_key:
        description: S3 object-key prefix for this run; defaults to github-runs/<run_id>
        required: false
        default: ""
      s3_prefix:
        description: Global S3 object-key prefix
        required: false
        default: ""

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cli
          tags: vine-and-fig-cli:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate and upload artifacts
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION_NAME: ${{ secrets.S3_REGION_NAME }}
          S3_PUBLIC_BASE_URL: ${{ vars.S3_PUBLIC_BASE_URL }}
          INPUT_ARTIFACT_KEY: ${{ inputs.artifact_key }}
          INPUT_S3_PREFIX: ${{ inputs.s3_prefix }}
          INPUT_DEFINITION_PATH: ${{ inputs.definition_path }}
        run: |
          set -euo pipefail

          definition_path="${INPUT_DEFINITION_PATH:-example_request.json}"
          artifact_key="${INPUT_ARTIFACT_KEY}"
          if [ -z "${artifact_key}" ]; then
            artifact_key="github-runs/${GITHUB_RUN_ID}"
          fi

          mkdir -p .generated/model

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e S3_BUCKET_NAME \
            -e S3_ENDPOINT_URL \
            -e S3_ACCESS_KEY_ID \
            -e S3_SECRET_ACCESS_KEY \
            -e S3_REGION_NAME \
            -e S3_PUBLIC_BASE_URL \
            -e S3_PREFIX="${INPUT_S3_PREFIX}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            vine-and-fig-cli generate "/workspace/${definition_path}" \
              --artifact-key "${artifact_key}" \
              --output-dir /workspace/.generated/model \
              --metadata "run.github_run_id=${GITHUB_RUN_ID}" \
              --metadata "run.commit_sha=${GITHUB_SHA}" \
              --metadata "run.branch=${GITHUB_REF_NAME}" \
              --metadata "run.workflow=${GITHUB_WORKFLOW}"

      - name: Build static viewer
        run: |
          set -euo pipefail
          mkdir -p .generated/pages
          cp viewer/index.html viewer/styles.css viewer/viewer.js .generated/pages/
          cp .generated/model/manifest.json .generated/pages/manifest.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .generated/pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
