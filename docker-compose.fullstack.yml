version: '3.8'

# Full-stack deployment with frontend and backend
services:
  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vine-and-fig-api
    ports:
      - "8080:8080"
    environment:
      # Server Settings
      - HOST=0.0.0.0
      - PORT=8080
      
      # CORS Origins - Frontend URL
      - CORS_ORIGINS=["http://localhost:3000","http://frontend:3000"]
      
      # Storage Type - "local" or "azure"
      - STORAGE_TYPE=local
      
      # Local File Storage
      - TEMP_DIR=/app/temp
      
      # Azure Storage Settings (uncomment when using Azure)
      # - AZURE_STORAGE_ACCOUNT_NAME=your-storage-account-name
      # - AZURE_STORAGE_SAS_TOKEN=your-sas-token
      # - AZURE_STORAGE_CONTAINER_NAME=vine-and-fig
      
      # File Cleanup
      - FILE_MAX_AGE=3600
      
      # API Settings
      - API_V1_PREFIX=/api
    
    volumes:
      - ./temp:/app/temp
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      - vine-and-fig-network
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 512M

  # Frontend
  frontend:
    build:
      context: ../vine-and-fig
      dockerfile: Dockerfile
    container_name: vine-and-fig-frontend
    ports:
      - "3000:3000"
    environment:
      # Point to the backend API service
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - vine-and-fig-network

networks:
  vine-and-fig-network:
    driver: bridge

volumes:
  temp:
    driver: local
