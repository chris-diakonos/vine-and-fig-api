version: '3.8'

# Full-stack development with hot-reload for both frontend and backend
services:
  # Backend API (Development)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vine-and-fig-api-dev
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - STORAGE_TYPE=local
      - TEMP_DIR=/app/temp
      # Azure Storage Settings (uncomment when using Azure)
      # - AZURE_STORAGE_ACCOUNT_NAME=your-storage-account-name
      # - AZURE_STORAGE_SAS_TOKEN=your-sas-token
      # - AZURE_STORAGE_CONTAINER_NAME=vine-and-fig
      - FILE_MAX_AGE=3600
      - API_V1_PREFIX=/api
    volumes:
      # Mount source code for hot-reload
      - ./src:/app/src
      - ./temp:/app/temp
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vine-and-fig-network

  # Frontend (Development)
  frontend:
    build:
      context: ../vine-and-fig
      dockerfile: Dockerfile.dev
    container_name: vine-and-fig-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
    volumes:
      # Mount source code for hot-reload
      - ../vine-and-fig/src:/app/src
      - ../vine-and-fig/public:/app/public
      - ../vine-and-fig/index.html:/app/index.html
      - ../vine-and-fig/vite.config.js:/app/vite.config.js
      - ../vine-and-fig/tailwind.config.js:/app/tailwind.config.js
      - ../vine-and-fig/postcss.config.js:/app/postcss.config.js
      # Don't mount node_modules
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - vine-and-fig-network

networks:
  vine-and-fig-network:
    driver: bridge
