<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vine & Fig GLB Viewer</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="viewer-shell">
      <header class="topbar">
        <div>
          <h1>Vine & Fig GLB Viewer</h1>
          <p id="artifact-label">Loading model manifest...</p>
          <p id="commit-info" class="meta-info"></p>
        </div>
        <a id="download-link" class="download-link" href="#" rel="noreferrer">Download GLB</a>
      </header>

      <section class="stage" aria-label="3D model preview">
        <div id="viewer-canvas" class="viewer-canvas"></div>
        <aside class="layer-panel" aria-label="Building layer controls">
          <div class="layer-panel-header">
            <span>Layers</span>
            <button id="show-all" type="button">Show All</button>
          </div>
          <div id="layer-controls" class="layer-controls"></div>
        </aside>
        <aside class="camera-panel" aria-label="Camera view controls">
          <div class="camera-panel-header">
            <span>View</span>
          </div>
          <div class="camera-controls">
            <button id="view-perspective" type="button" class="camera-btn">3D</button>
            <button id="view-front" type="button" class="camera-btn">Front</button>
            <button id="view-rear" type="button" class="camera-btn">Rear</button>
            <button id="view-left" type="button" class="camera-btn">Left</button>
            <button id="view-right" type="button" class="camera-btn">Right</button>
            <button id="fit-visible" type="button" class="camera-btn fit-btn">Fit</button>
          </div>
        </aside>
        <div id="model-status" class="model-status">Loading GLB...</div>
        <div id="error-message" class="error-message" hidden></div>
      </section>

      <footer class="metadata">
        <span id="structure-hash">Structure hash unavailable</span>
        <span id="mesh-hash">Mesh hash unavailable</span>
        <a id="bom-link" href="#" rel="noreferrer">BOM JSON</a>
        <a id="manifest-link" href="./manifest.json">Manifest JSON</a>
      </footer>
    </main>

    <script type="module" src="./viewer.js"></script>
  </body>
</html>
