version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vine-and-fig-api
    ports:
      - "8080:8080"
    environment:
      # Server Settings
      - HOST=0.0.0.0
      - PORT=8080
      
      # CORS Origins - Update these for your frontend URLs
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:5174"]
      
      # Storage Type - "local" or "azure"
      - STORAGE_TYPE=azure
      
      # Local File Storage
      - TEMP_DIR=/app/temp
      
      # Azure Storage Settings (uncomment when using Azure)
      - AZURE_STORAGE_ACCOUNT_NAME=savineandfig
      - AZURE_STORAGE_SAS_TOKEN=sv=2024-11-04&ss=b&srt=sco&sp=rwdlac&se=2026-12-31T12:18:56Z&st=2025-10-02T03:03:56Z&spr=https&sig=WNvT6YeDz12%2B70KHrI1g2u%2FlMl2%2Fek6BWbaiICRpxA8%3D
      - AZURE_STORAGE_CONTAINER_NAME=data
      
      # File Cleanup (in seconds)
      - FILE_MAX_AGE=3600
      
      # API Settings
      - API_V1_PREFIX=/api
    
    volumes:
      # Mount temp directory for persistent file storage (optional)
      - ./temp:/app/temp
      
      # Mount source code for development (comment out for production)
      # - ./src:/app/src
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      - vine-and-fig-network
    
    # Resource limits (optional - adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 512M

networks:
  vine-and-fig-network:
    driver: bridge

volumes:
  temp:
    driver: local
